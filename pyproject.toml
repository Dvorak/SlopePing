[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"run_checker.py" = ["E402"]
"scripts/webhook_server.py" = ["E402"]

[tool.mypy]
python_version = "3.11"
files = ["src", "run_checker.py", "scripts/webhook_server.py"]
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
